<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Karan</title>
<meta name="description" content="That page does not exist.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body>
<div class="bg" aria-hidden="true">
  <div class="bg-aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
  <div class="bg-grid"></div>
</div>

<main class="wrap" style="min-height:100dvh;display:grid;place-content:center;text-align:center;gap:1.5rem;padding-block:4rem">
  <p class="eyebrow" style="margin:0 auto">
    <span class="pulse" aria-hidden="true"></span>
    error 404
  </p>

  <h1 style="font-size:var(--step-5);letter-spacing:-.035em;line-height:1">
    Not found<span style="background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;color:transparent">.</span>
  </h1>

  <p style="max-width:34rem;margin:0 auto;color:var(--foreground-secondary);font-size:var(--step-1);line-height:var(--leading-relaxed)">
    That URL doesn't resolve to anything. It may have been renamed, or the link that sent
    you here was mistyped.
  </p>

  <div style="display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.5rem">
    <a class="btn btn-primary" href="/">Back to home</a>
    <a class="btn btn-ghost" href="/#work">See the work</a>
  </div>
</main>
</body>
</html>
